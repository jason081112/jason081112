name: Render profile stats

on:
  schedule:
    - cron: "0 3 * * *"      # 每天 03:00 UTC 刷新
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/stats.svg resources/top-langs.svg
          if git diff --staged --quiet; then
            echo "统计无变化，跳过提交"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
